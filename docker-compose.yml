# Docker compose example for Dokuwiki (used for development)
services:
  dokuwiki:
    hostname: dokuwiki
    image: upb-cs-ocw/dokuwiki:latest
    user: "app:app"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_UID: "${APP_UID:-33}"
      APP_GID: "${APP_GID:-33}"
      PHP_TIMEZONE: "${TZ:-Europe/Bucharest}"
      DOKUWIKI_ADMIN_USER: ${DOKUWIKI_ADMIN_USER:-admin}
      DOKUWIKI_ADMIN_PASSWORD: ${DOKUWIKI_ADMIN_PASSWORD:-admin123}
    volumes:
      - ${DOKUWIKI_STORAGE_DIR:-/var/dokuwiki/storage}:/storage
