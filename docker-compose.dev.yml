# Docker compose example for Dokuwiki (used for development)
services:
  dokuwiki:
    hostname: dokuwiki
    image: upb-cs-ocw/dokuwiki:latest
    user: "app:app"
    restart: no
    ports:
      - "8080:8080"
    environment:
      APP_UID: "${APP_UID:-1000}"
      APP_GID: "${APP_GID:-1000}"
      PHP_TIMEZONE: "${TZ:-Europe/Bucharest}"
      DOKUWIKI_ADMIN_USER: ${DOKUWIKI_ADMIN_USER:-admin}
      DOKUWIKI_ADMIN_PASSWORD: ${DOKUWIKI_ADMIN_PASSWORD:-admin123}
      # set to "yes" to install the demo
      DOKUWIKI_DEMO_INSTALL: ${DOKUWIKI_DEMO_INSTALL:-yes}
    volumes:
      - ${DOKUWIKI_STORAGE_DIR:-./tmp}:/storage
      # uncomment for template development:
      #- ./dokuwiki/tpl/arctic-cs/:/storage/lib/tpl/arctic-cs/:ro
