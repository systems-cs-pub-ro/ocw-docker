; Arctic CS template - based on the DokuWiki template (2012+)
; Visual port of the Arctic / OCW template
;
; To extend this file or make changes to it, it is recommended to create
; a local conf/tpl/arctic-cs/style.ini file to prevent losing
; any changes after an upgrade.

; Define the stylesheets your template uses here. The second value
; defines for which output media the style should be loaded. Currently
; print, screen and all are supported.

[stylesheets]

css/basic.less            = screen
css/_imgdetail.css        = screen
css/_media_popup.css      = screen
css/_media_fullscreen.css = screen
css/_fileuploader.css     = screen
css/_tabs.css             = screen
css/_links.css            = screen
css/_toc.css              = screen
css/_footnotes.css        = screen
css/_search.less          = screen
css/_recent.css           = screen
css/_diff.css             = screen
css/_edit.css             = screen
css/_modal.css            = screen
css/_forms.css            = screen
css/_admin.less           = screen
css/structure.less        = screen
css/design.less           = screen
css/usertools.less        = screen
css/content.less          = screen

css/mobile.less           = all
css/print.css             = print

; Placeholders defined here will also be made available as LESS variables
; (with surrounding underscores removed, and the prefix @ini_ added)

[replacements]

;--------------------------------------------------------------------------
;------ guaranteed dokuwiki color placeholders that every plugin can use

; main text and background colors
__text__            = "#333"            ; @ini_text
__background__      = "#fff"            ; @ini_background
; alternative text and background colors
__text_alt__        = "#638c9c"         ; @ini_text_alt
__background_alt__  = "#dee7ec"         ; @ini_background_alt
; neutral text and background colors
__text_neu__        = "#666"            ; @ini_text_neu
__background_neu__  = "#f5f5f5"         ; @ini_background_neu
; border color
__border__          = "#ccc"            ; @ini_border

; highlighted text (e.g. search snippets)
__highlight__       = "#ff9"            ; @ini_highlight

; default link color (classic OCW blue, hover is darker teal)
__link__            = "#436976"         ; @ini_link
__link_hover__      = "#333"            ; @ini_link_hover

;--------------------------------------------------------------------------

__background_site__ = "#f8f8f8"         ; @ini_background_site

; these are used for wiki links
__existing__        = "#567ec8"         ; @ini_existing
__missing__         = "#ed5353"         ; @ini_missing

; site and sidebar widths
__site_width__      = "85em"            ; @ini_site_width
__sidebar_width__   = "18em"            ; @ini_sidebar_width
; cut off points for mobile devices
__tablet_width__    = "800px"           ; @ini_tablet_width
__phone_width__     = "480px"           ; @ini_phone_width

__theme_color__     = "#436976"         ; @_ini_theme_color: theme_color of the web app

;--------------------------------------------------------------------------
;------ arctic specific placeholders

__headline_color__  = "#333"            ; @ini_headline_color
__header_background__ = "#fff"          ; @ini_header_background
__footer_background__ = "#436976"       ; @ini_footer_background
__footer_color__ = "#fff"       ; @ini_footer_color
__header_text__     = "#aaa"            ; @ini_header_text
